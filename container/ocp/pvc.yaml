apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: soloist-session-data
  namespace: app-teddycloud
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # storageClassName omitted → cluster default StorageClass.
  # Soloist session + settings are small (< a few MB); 1Gi is headroom.