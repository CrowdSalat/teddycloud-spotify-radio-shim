# SOLOIST_API_KEY via External Secrets Operator.
#
# Prerequisites:
#   - A ClusterSecretStore named `cluster-secret-store` (or edit
#     spec.secretStoreRef.name below). Its backend must expose a key
#     `soloist-api-key` (edit spec.data[].remoteRef.key if your path
#     differs), whose value is the Spotify Soloist API key.
#   - The operator creates the target Secret `soloist-api-key`, which the
#     Deployment consumes via secretKeyRef.
#
# Without ESO, substitute: oc create secret generic soloist-api-key \
#   --from-literal=SOLOIST_API_KEY=<key> -n app-teddycloud
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: soloist-api-key
  namespace: app-teddycloud
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: soloist-api-key
    creationPolicy: Owner
  data:
    - secretKey: SOLOIST_API_KEY
      remoteRef:
        key: soloist-api-key