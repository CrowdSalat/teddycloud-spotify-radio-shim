# SOLOIST_API_KEY via External Secrets Operator from the Infisical
# ClusterSecretStore (same store as the other app-teddycloud secrets).
#
# The Deployment consumes the generated Secret `soloist-api-key`
# (key SOLOIST_API_KEY) via secretKeyRef. Adjust spec.data[0].remoteRef.key
# to the Infisical path that holds the Soloist API key.
#
# Without ESO, substitute: oc create secret generic soloist-api-key \
#   --from-literal=SOLOIST_API_KEY=<key> -n app-teddycloud
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: soloist-api-key
  namespace: app-teddycloud
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: soloist-api-key
  data:
    - secretKey: SOLOIST_API_KEY
      remoteRef:
        key: SOLOIST_API_KEY