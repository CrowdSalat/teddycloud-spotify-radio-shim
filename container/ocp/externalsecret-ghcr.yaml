# GITHUB_TOKEN (Infisical, same ClusterSecretStore as the other app-teddycloud
# secrets) rendered into a kubernetes.io/dockerconfigjson secret named
# `ghcr-pull`. The Deployment references it as imagePullSecrets[0].name.
#
# The username is the GitHub account that owns the GHCR package
# (ghcr.io/crowdsalat/teddycloud-spotify-shim). Adjust if the token belongs to
# a different account.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
  namespace: app-teddycloud
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: ghcr-pull
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"crowdsalat","password":"{{ .GITHUB_TOKEN }}","auth":"{{ printf "crowdsalat:%s" .GITHUB_TOKEN | b64enc }}"}}}
  data:
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: GITHUB_TOKEN